name: TKD / ITM Daily Price Scrape

on:
  schedule:
    - cron: '0 16 * * *'   # 16:00 UTC = 2:00 AM AEST
  workflow_dispatch:        # allow manual runs from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run price scrape
        env:
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
        run: node scrape.js

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-prices.csv history/
          git diff --cached --quiet || git commit -m "chore: daily TKD price scrape $(date -u +%Y-%m-%d)"
          git push
